<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>صندوق الحساب · Calc Box</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap"><style>
:root{--bg:#EEF1F6;--panel:#fff;--ink:#1B2430;--muted:#6B7785;--line:#DCE2EA;--accent:#3B6FE0;--key:#fff;--shadow:#C9D2DE;--op:#EAF0FF;--opink:#2C5BD6;--chip:#E6EBF3;color-scheme:light}
:root[data-theme=dark]{--bg:#0F141B;--panel:#161D26;--ink:#E7EDF4;--muted:#8C9AA8;--line:#26303C;--accent:#5B8CFF;--key:#1C2530;--shadow:#0B1017;--op:#1E2A3C;--opink:#8FB0FF;--chip:#202A36;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro","Segoe UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}.wrap{max-width:520px;margin:auto;padding:14px 12px 30px;display:flex;flex-direction:column;gap:12px}header{display:flex;align-items:center;gap:10px}h1{font-size:1.15rem;flex:1;margin:0}button,input,select{font-family:inherit;color:var(--ink)}button{cursor:pointer;border:0;background:var(--panel);border-radius:12px;padding:10px;font-weight:600;box-shadow:0 3px 0 var(--shadow),0 8px 16px #0001}button:active{transform:translateY(2px);box-shadow:none}.tabs{display:flex;gap:6px;background:var(--panel);padding:6px;border-radius:16px;box-shadow:0 3px 0 var(--shadow)}.tab{flex:1;background:transparent;color:var(--muted);box-shadow:none}.tab[aria-selected=true],.primary{background:var(--accent);color:white}.panel{display:none}.panel.active{display:block}.display,.result-box{background:var(--panel);border-radius:20px;padding:16px 18px;box-shadow:0 4px 0 var(--shadow),0 10px 24px #0001;margin-bottom:12px;min-height:100px}.expr{color:var(--muted);min-height:1.4em}.expr,.result{direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result{font-size:2.4rem;font-weight:700}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;direction:ltr}.key{height:64px;border-radius:18px;font-size:1.55rem;background:var(--key)}.op{background:var(--op);color:var(--opink)}.fn{background:var(--chip);color:var(--muted);font-size:1.1rem}.eq{background:#3B6FE0;color:white}.wide{grid-column:span 2}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}label{font-size:.85rem;color:var(--muted);font-weight:600}.input-row,.time-grid,.time-actions{display:flex;gap:8px;margin-bottom:10px}input,select{min-width:0;flex:1;width:100%;border:0;border-radius:14px;padding:14px;font-size:1rem;background:var(--panel);box-shadow:inset 0 -3px 0 var(--shadow)}.input-row select{flex:0 0 120px}#convCat{flex:1}.time-grid input{text-align:center}.time-actions button{flex:1}.swap{display:block;margin:0 auto 12px;background:var(--accent);color:white;border-radius:50%;width:42px;height:42px}.result-box{text-align:center;min-height:0}.big{font-size:2rem;font-weight:700;color:var(--accent)}.detail{color:var(--muted);font-size:.9rem;margin-top:4px}.history h3{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem}.history h3 button{color:#D64545;background:transparent;box-shadow:none}.hitem{display:flex;justify-content:space-between;gap:10px;width:100%;margin-bottom:6px;text-align:start}.hitem span:last-child{color:var(--accent)}hr{border:0;border-top:1px solid var(--line);margin:16px 0}@media(max-width:380px){.key{height:58px;font-size:1.35rem}}
</style></head><body><div class="wrap"><header><h1>🧮 Calc Box</h1><button id="langBtn">EN</button><button id="themeBtn">🌙</button></header><div class="tabs" role="tablist"><button class="tab" data-tab="calc" aria-selected="true" data-i="tabCalc"></button><button class="tab" data-tab="conv" aria-selected="false" data-i="tabConv"></button><button class="tab" data-tab="time" aria-selected="false" data-i="tabTime"></button></div>
<section class="panel active" id="panel-calc"><div class="display"><div class="expr" id="expr"></div><div class="result" id="result">0</div></div><div class="keys" id="keys"></div><div class="history"><h3><span data-i="history"></span><button id="clearHist" data-i="clear"></button></h3><div id="histList"></div></div></section>
<section class="panel" id="panel-conv"><div class="field"><label data-i="category"></label><div class="input-row"><select id="convCat"><option value="length" data-i="length"></option><option value="weight" data-i="weight"></option><option value="temp" data-i="temp"></option><option value="area" data-i="area"></option><option value="speed" data-i="speed"></option></select></div></div><div class="field"><label data-i="from"></label><div class="input-row"><input type="number" id="convFrom" value="1" inputmode="decimal"><select id="unitFrom"></select></div></div><button class="swap" id="swapBtn" aria-label="Swap">⇅</button><div class="field"><label data-i="to"></label><div class="input-row"><input type="number" id="convTo" readonly><select id="unitTo"></select></div></div><div class="result-box"><div class="big" id="convResult"></div><div class="detail" id="convDetail"></div></div></section>
<section class="panel" id="panel-time"><div id="durations"></div><div class="time-actions"><button class="primary" id="addTime" data-i="add"></button><button id="subTime" data-i="sub"></button></div><div class="result-box"><div class="big" id="timeResult">0</div><div class="detail" id="timeDetail"></div></div><hr><div class="field"><label data-i="dateDiff"></label><div class="input-row"><input type="date" id="d1"><input type="date" id="d2"></div></div><div class="result-box"><div class="big" id="dateResult">—</div><div class="detail" id="dateDetail"></div></div></section></div>
<script>
(()=>{"use strict";const $=id=>document.getElementById(id), root=document.documentElement, I={ar:{tabCalc:"حاسبة",tabConv:"تحويل",tabTime:"وقت",history:"السجل",clear:"مسح",category:"الفئة",length:"طول",weight:"وزن",temp:"حرارة",area:"مساحة",speed:"سرعة",from:"من",to:"إلى",time1:"المدة الأولى",time2:"المدة الثانية",add:"جمع +",sub:"طرح −",dateDiff:"الفرق بين تاريخين"},en:{tabCalc:"Calculator",tabConv:"Converter",tabTime:"Time",history:"History",clear:"Clear",category:"Category",length:"Length",weight:"Weight",temp:"Temperature",area:"Area",speed:"Speed",from:"From",to:"To",time1:"Duration 1",time2:"Duration 2",add:"Add +",sub:"Subtract −",dateDiff:"Date difference"}};
let lang=localStorage.getItem("cb:lang")==="en"?"en":"ar",hist=[];try{hist=JSON.parse(localStorage.getItem("cb:hist"))||[]}catch(e){};root.dataset.theme=localStorage.getItem("cb:theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");function theme(){ $("themeBtn").textContent=root.dataset.theme==="dark"?"☀️":"🌙"}theme();$("themeBtn").onclick=()=>{root.dataset.theme=root.dataset.theme==="dark"?"light":"dark";localStorage.setItem("cb:theme",root.dataset.theme);theme()};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="panel-"+t.dataset.tab))});
let expr="",cur="0",fresh=true,done=false;function refresh(){$("expr").textContent=expr;$("result").textContent=cur}function renderHistory(){$("histList").replaceChildren();hist.forEach(h=>{let b=document.createElement("button"),a=document.createElement("span"),r=document.createElement("span");b.className="hitem";a.textContent=h.e;r.textContent="= "+h.r;b.append(a,r);b.onclick=()=>{if(Number.isFinite(Number(h.r))){cur=h.r;expr=h.e+" =";done=true;fresh=true;refresh()}else{document.querySelector('[data-tab=time]').click()}};$("histList").append(b)})}function save(e,r){hist.unshift({e,r,t:Date.now()});hist=hist.slice(0,20);localStorage.setItem("cb:hist",JSON.stringify(hist));renderHistory()}$("clearHist").onclick=()=>{hist=[];localStorage.removeItem("cb:hist");renderHistory()};
function press(k){if(k==="C"){expr="";cur="0";fresh=true;done=false}else if(k==="⌫"){if(done){expr="";done=false}cur=cur.length>1?cur.slice(0,-1):"0";fresh=false}else if(/^[0-9.]$/.test(k)){if(done){expr="";done=false;fresh=true}if(fresh){cur="0";fresh=false}if(k!==".")cur=cur==="0"?k:cur+k;else if(!cur.includes("."))cur+="."}else if(k==="%"){cur=String(Number(cur)/100);fresh=false}else if(k==="="){if(expr&&!done){let full=expr+cur;let s=full.replaceAll("×","*").replaceAll("÷","/").replaceAll("−","-");try{if(!/^[0-9eE+*/. -]+$/.test(s))throw Error();let n=Function('"use strict";return ('+s+')')();if(!Number.isFinite(n))throw Error();cur=String(Number(n.toPrecision(12)));save(full,cur)}catch(e){cur=lang==="ar"?"خطأ":"Error"}expr=full+" =";done=true;fresh=true}}else if("+−×÷".includes(k)){if(done){expr=cur+k;done=false}else if(fresh&&expr){expr=expr.slice(0,-1)+k}else{expr+=cur+k}cur="0";fresh=true}refresh()}
["C","⌫","%","÷","7","8","9","×","4","5","6","−","1","2","3","+","0",".","="].forEach(k=>{let b=document.createElement("button");b.textContent=k;b.className="key "+("C⌫%".includes(k)?"fn":k==="="?"eq":"+−×÷".includes(k)?"op":k==="0"?"wide":"");b.onclick=()=>press(k);$("keys").append(b)});
const U={length:{m:["متر","Meter",1],cm:["سم","cm",.01],mm:["مم","mm",.001],km:["كم","km",1000],inch:["إنش","Inch",.0254],ft:["قدم","Foot",.3048],mile:["ميل","Mile",1609.344]},weight:{kg:["كغ","kg",1],g:["غرام","g",.001],lb:["باوند","lb",.45359237],oz:["أونصة","oz",.0283495],ton:["طن","Ton",1000]},temp:{c:["مئوية","Celsius"],f:["فهرنهايت","Fahrenheit"],k:["كلفن","Kelvin"]},area:{m2:["م²","m²",1],km2:["كم²","km²",1e6],cm2:["سم²","cm²",1e-4],ft2:["قدم²","ft²",.092903],acre:["أكر","Acre",4046.86]},speed:{kmh:["كم/س","km/h",1],ms:["م/ث","m/s",3.6],mph:["ميل/س","mph",1.60934],knot:["عقدة","Knot",1.852]}};
function units(keep){let list=U[$("convCat").value],idx=lang==="ar"?0:1;["unitFrom","unitTo"].forEach((id,i)=>{let el=$(id),old=el.value;el.replaceChildren();Object.keys(list).forEach(k=>el.add(new Option(list[k][idx],k)));el.selectedIndex=i;if(keep&&list[old])el.value=old})}function conv(){let cat=$("convCat").value,a=$("unitFrom").value,b=$("unitTo").value,v=parseFloat($("convFrom").value),list=U[cat],i=lang==="ar"?0:1;if(!Number.isFinite(v)){$("convTo").value="";$("convResult").textContent="—";$("convDetail").textContent="";return}let r;if(cat==="temp"){let c=a==="c"?v:a==="f"?(v-32)*5/9:v-273.15;r=b==="c"?c:b==="f"?c*9/5+32:c+273.15}else r=v*list[a][2]/list[b][2];r=Math.round(r*1e8)/1e8;$("convTo").value=r;$("convResult").textContent=r;$("convDetail").textContent=v+" "+list[a][i]+" = "+r+" "+list[b][i]}$("convCat").onchange=()=>{units(false);conv()};$("unitFrom").onchange=$("unitTo").onchange=$("convFrom").oninput=conv;$("swapBtn").onclick=()=>{let a=$("unitFrom").value;$("unitFrom").value=$("unitTo").value;$("unitTo").value=a;conv()};
[1,2].forEach(n=>{let f=document.createElement("div");f.className="field";let l=document.createElement("label");l.dataset.i="time"+n;let g=document.createElement("div");g.className="time-grid";["h","m","s"].forEach(k=>{let e=document.createElement("input");e.id=k+n;e.type="number";e.min=0;e.inputMode="numeric";g.append(e)});f.append(l,g);$("durations").append(f)});function dur(n){return ["h","m","s"].reduce((a,k,i)=>a+(parseFloat($(k+n).value)||0)*[3600,60,1][i],0)}function fmt(t,long){t=Math.round(t);let sign=t<0?"−":"";t=Math.abs(t);let h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;if(long)return sign+h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");let p=[h,m,s].map((v,i)=>v?v+(lang==="ar"?[" س"," د"," ث"][i]:["h","m","s"][i]):"").filter(Boolean);return sign+(p.join(" ")||"0")}let lastTime=null;function time(op){lastTime=dur(1)+op*dur(2);$("timeResult").textContent=fmt(lastTime);$("timeDetail").textContent=fmt(lastTime,true);save("⏱ "+fmt(dur(1))+(op===1?" + ":" − ")+fmt(dur(2)),fmt(lastTime))}$("addTime").onclick=()=>time(1);$("subTime").onclick=()=>time(-1);function date(){let a=$("d1").value,b=$("d2").value;if(!a||!b){$("dateResult").textContent="—";$("dateDetail").textContent="";return}let d=Math.round((new Date(b)-new Date(a))/86400000);$("dateResult").textContent=d+(lang==="ar"?" يوم":" days");$("dateDetail").textContent=Math.abs(d)+(lang==="ar"?" يوم (بالقيمة المطلقة)":" days (absolute)")}$("d1").onchange=$("d2").onchange=date;
function apply(){root.lang=lang;root.dir=lang==="ar"?"rtl":"ltr";$("langBtn").textContent=lang==="ar"?"EN":"ع";document.querySelectorAll("[data-i]").forEach(e=>e.textContent=I[lang][e.dataset.i]);[1,2].forEach(n=>["h","m","s"].forEach((k,i)=>{$(k+n).placeholder=lang==="ar"?["س","د","ث"][i]:k;$(k+n).setAttribute("aria-label",lang==="ar"?["ساعات","دقائق","ثواني"][i]:["Hours","Minutes","Seconds"][i])}));units(true);conv();date();renderHistory();if(lastTime!==null)$("timeResult").textContent=fmt(lastTime)}$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";localStorage.setItem("cb:lang",lang);apply()};document.addEventListener("keydown",e=>{if(!$("panel-calc").classList.contains("active")||e.ctrlKey||e.metaKey)return;let k=({"*":"×","/":"÷","-":"−",Enter:"=",Backspace:"⌫",Escape:"C"})[e.key]||e.key;if(/^[0-9.]$/.test(k)||"+−×÷=%C⌫".includes(k)){e.preventDefault();press(k)}});apply();refresh()})();
</script></body></html>
