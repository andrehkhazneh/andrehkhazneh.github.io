<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عقاراتي</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8efe9;color:#233a35;font:16px Tahoma,Arial,sans-serif}main{max-width:650px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:10px 0}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px;background:#226d59;color:white;box-shadow:0 3px #154b3e}button:disabled{background:#dce4df;color:#68766f;box-shadow:none;cursor:default}.balance{background:#173f36;color:white;padding:22px;border-radius:20px;margin:16px 0}.balance strong{display:block;font-size:36px;margin:8px 0}.city{display:grid;grid-template-columns:repeat(4,1fr);align-items:end;background:#c9ddc5;border-radius:18px;padding:12px;min-height:155px;gap:4px}.city img{width:100%;height:130px;object-fit:contain;object-position:bottom}.city img.locked{opacity:.18;filter:grayscale(1)}article{display:grid;grid-template-columns:clamp(92px,24vw,116px) minmax(0,1fr) auto;gap:10px;align-items:center;background:white;padding:12px;margin:12px 0;border-radius:16px;box-shadow:0 3px #d2ded6}article img{width:100%;height:116px;object-fit:contain}small{display:block;color:#64766d;margin-top:8px}footer{text-align:center;margin:24px 0;color:#64766d}#reset{background:transparent;color:#9b4141;box-shadow:none} @media(max-width:380px){article{grid-template-columns:92px minmax(0,1fr)}article img{width:92px;grid-row:span 2}article button{grid-column:2}}
</style><main><header><h1 id="title">عقاراتي</h1><button id="lang">English</button></header><section class="balance"><span id="cashLabel"></span><strong id="money"></strong><span id="income"></span></section><div class="city" id="city"></div><p id="offline"></p><div id="cards"></div><footer><button id="reset"></button><small>V1.1</small></footer></main><script>
const P=[['house','بيت إيجار','Rental house',0,1,5,60],['flat','عمارة سكنية','Apartments',500,5,3,750],['shop','محل تجاري','Shop',2000,15,3,3000],['hotel','فندق','Hotel',10000,60,3,15000]], key='ak-real-estate-v1';const fresh=()=>({money:0,levels:[1,0,0,0],time:Date.now(),lang:'ar'});let s=fresh();try{let v=JSON.parse(localStorage.getItem(key));if(v&&Number.isFinite(v.money)&&v.money>=0&&Array.isArray(v.levels)&&v.levels.length===4&&v.levels.every((x,i)=>Number.isInteger(x)&&x>=0&&x<=P[i][5])&&v.levels[0]>=1&&Number.isFinite(v.time))s=v}catch(e){}const $=id=>document.getElementById(id),ar=()=>s.lang!=='en',t=(a,b)=>ar()?a:b,fmt=n=>Math.floor(n).toLocaleString('en-US')+' $',income=()=>P.reduce((a,p,i)=>a+p[4]*s.levels[i],0),cost=i=>s.levels[i]===0?P[i][3]:Math.round(P[i][6]*1.8**(s.levels[i]-1));let offline=Math.max(0,Math.min(28800,(Date.now()-s.time)/1000))*income();s.money+=offline;s.time=Date.now();function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}function tick(){let now=Date.now();s.money+=Math.max(0,Math.min(28800,(now-s.time)/1000))*income();s.time=now}function render(){document.documentElement.lang=ar()?'ar':'en';document.documentElement.dir=ar()?'rtl':'ltr';$('title').textContent=t('عقاراتي','My Properties');$('lang').textContent=t('English','العربية');$('cashLabel').textContent=t('الرصيد المتاح','Available balance');$('reset').textContent=t('إعادة تعيين اللعبة','Reset game');$('offline').textContent=offline>=1?t('أرباح الغياب: ','Offline earnings: ')+fmt(offline):'';$('city').replaceChildren();$('cards').replaceChildren();P.forEach((p,i)=>{let l=s.levels[i],src=('fitted/'+p[0])+Math.max(1,l)+'.png',img=new Image();img.src=src;img.alt=p[ar()?1:2];if(!l)img.className='locked';$('city').append(img);let card=document.createElement('article'),pic=new Image();pic.src=src;pic.alt=img.alt;let info=document.createElement('div');let title=document.createElement('b');title.textContent=img.alt;let sub=document.createElement('small');sub.textContent=l?t('المستوى ','Level ')+l+' · '+fmt(l*p[4])+t(' / ثانية',' / sec'):t('غير مملوك','Not owned');info.append(title,sub);let btn=document.createElement('button');btn.id='buy'+i;btn.onclick=()=>{tick();let c=cost(i);if(s.levels[i]<p[5]&&s.money>=c){s.money-=c;s.levels[i]++;save();render()}};card.append(pic,info,btn);$('cards').append(card)});refresh()}function refresh(){$('money').textContent=fmt(s.money);$('income').textContent=t('الدخل: ','Income: ')+fmt(income())+t(' / ثانية',' / sec');P.forEach((p,i)=>{let b=$('buy'+i),l=s.levels[i];b.disabled=l>=p[5]||s.money<cost(i);b.textContent=l>=p[5]?t('أقصى مستوى','Max level'):t(l?'تطوير':'شراء',l?'Upgrade':'Buy')+' · '+fmt(cost(i))})}$('lang').onclick=()=>{s.lang=ar()?'en':'ar';save();render()};$('reset').onclick=()=>{if(confirm(t('حذف كل التقدم؟','Delete all progress?'))){let lang=s.lang;s=fresh();s.lang=lang;offline=0;save();render()}};render();save();setInterval(()=>{tick();refresh()},250);setInterval(save,3000);addEventListener('pagehide',()=>{tick();save()});document.addEventListener('visibilitychange',()=>{tick();save();refresh()});</script></html>
