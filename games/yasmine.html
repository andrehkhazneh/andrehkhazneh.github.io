<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ياسمينة البيت | أندريه خزنه</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#0e1a2b,#1b2e47);color:#e9eef5;font-family:Tahoma,Arial,sans-serif;text-align:center}main{max-width:440px;margin:auto;padding:24px 18px}h1{font-size:2rem}a{color:#f3d9a0}.scene{border:1px solid #526078;border-radius:22px;background:#12223a;margin:20px 0}svg{width:100%;display:block}.meters{display:grid;gap:12px;text-align:right}.meter{display:grid;grid-template-columns:60px 1fr;align-items:center;gap:12px}.bar{height:12px;background:#34445b;border-radius:12px;overflow:hidden}.bar i{display:block;height:100%;transition:width .5s}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}button{border:0;border-radius:14px;padding:15px 4px;background:#fffdf4;color:#15233a;font-weight:bold;font-size:15px;cursor:pointer}.note{padding:15px;background:#ffffff13;border-radius:12px;margin:10px 0;line-height:1.9}#msg{color:#f3d9a0;min-height:2em}#reset{background:transparent;color:#d5d9e2;border:1px solid #65748a;margin:18px}#plant{transform-origin:150px 296px;animation:sway 6s ease-in-out infinite}@keyframes sway{50%{transform:rotate(1.5deg)}}@media(prefers-reduced-motion:reduce){#plant{animation:none}}</style><main><a href="/#games">← العودة إلى الألعاب</a><h1>ياسمينة البيت 🌿</h1><p>اعتني فيها، وبترجع تزهّر.</p><h3 id="stage"></h3><div class="scene"><svg viewBox="0 0 300 360" role="img" aria-label="ياسمينة في أصيص"><circle cx="250" cy="50" r="21" fill="#f6efd8"/><circle cx="260" cy="44" r="20" fill="#12223a"/><g id="plant"></g><path d="M96 298H204L194 352Q193 358 186 358H114Q107 358 106 352Z" fill="#c9b79c"/><rect x="90" y="288" width="120" height="16" rx="6" fill="#b5a285"/><ellipse cx="150" cy="296" rx="52" ry="6" fill="#3a2a22"/></svg></div><div class="meters"><div class="meter">الماء<div class="bar"><i id="water" style="background:#6fb7e8"></i></div></div><div class="meter">الضوء<div class="bar"><i id="light" style="background:#f3d27a"></i></div></div><div class="meter">الغذاء<div class="bar"><i id="food" style="background:#b9a1e0"></i></div></div></div><div class="actions"><button onclick="care('water')">اسقيها</button><button onclick="care('light')">ضوّي عليها</button><button onclick="care('food')">غذّيها</button></div><p id="msg" aria-live="polite"></p><h2>خواطر الياسمينة</h2><div id="notes"></div><button id="reset" onclick="resetGame()">ابدأ من جديد</button></main><script>
const NOTES=[{at:10,text:"هون بتحط خاطرتك الأولى."},{at:30,text:"هون بتحط خاطرتك التانية."},{at:55,text:"هون بتحط خاطرتك التالتة."},{at:80,text:"هون بتحط خاطرتك الرابعة."},{at:100,text:"هون بتحط خاطرتك الأخيرة، لما تزهّر."}];
const fresh=()=>({water:60,light:60,food:60,growth:0,t:Date.now()});let S;try{S=JSON.parse(localStorage.getItem('yasmine-game-v1'))||fresh()}catch(e){S=fresh()}const clamp=x=>Math.max(0,Math.min(100,x));function save(){localStorage.setItem('yasmine-game-v1',JSON.stringify(S))}function tick(){let now=Date.now(),m=Math.max(0,(now-S.t)/60000);if(!m)return;let ok=S.water>=25&&S.light>=25;S.water=clamp(S.water-.12*m);S.light=clamp(S.light-.10*m);S.food=clamp(S.food-.05*m);if(ok)S.growth=clamp(S.growth+.02*m);S.t=now}
function draw(){for(let k of ['water','light','food'])document.getElementById(k).style.width=S[k]+'%';let g=S.growth;document.getElementById('stage').textContent=g>=90?'ياسمينة مزهّرة':g>=65?'طلّعت براعم':g>=50?'ساقها قويت':g>=25?'ورقها عم يكتر':g>=6?'نبتة صغيرة طلّعت راسها':'بذرة نايمة بالتراب';let out='';if(g<6){out='<ellipse cx="150" cy="293" rx="5" ry="3" fill="#7a5a3a"/>'+(g>2?'<path d="M150 296Q150 286 152 280" stroke="#6fb184" stroke-width="3" fill="none"/>':'')}else{let h=30+g*2,top=296-h;out='<path d="M150 296Q136 '+(296-h*.5)+' 150 '+top+'" stroke="#4a8a63" stroke-width="4" fill="none"/>';for(let i=0;i<Math.min(12,Math.floor(g/6));i++){let t=.18+i/12*.78,y=(1-t)*(1-t)*296+2*(1-t)*t*(296-h*.5)+t*t*top,x=150-28*t*(1-t),side=i%2?-1:1;out+='<path d="M0 0C12 -11 30 -10 40 0C30 10 12 11 0 0Z" fill="#6fb184" transform="translate('+x+' '+y+') scale('+side*.85+' .85) rotate(-28)"/>'}if(g>=65){for(let i=0;i<5;i++){let x=150+(i-2)*21,y=top+Math.abs(i-2)*15;if(g>=90){out+='<g transform="translate('+x+' '+y+')">';for(let p=0;p<5;p++)out+='<ellipse cx="0" cy="-8" rx="4.2" ry="9" fill="#fffdf4" transform="rotate('+(p*72)+')"/>';out+='<circle r="3" fill="#f0c95a"/></g>'}else out+='<ellipse cx="'+x+'" cy="'+y+'" rx="4" ry="7" fill="#f4ecd4"/>'}}}document.getElementById('plant').innerHTML=out;document.getElementById('notes').innerHTML=NOTES.map(n=>'<div class="note">'+(g>=n.at?n.text:'بتنفتح لما تكبر الياسمينة')+'</div>').join('')}
function care(k){tick();if(S[k]>85){document.getElementById('msg').textContent='كفاية هلأ، خلّي الياسمينة ترتاح شوي.'}else{S[k]=clamp(S[k]+32);S.growth=clamp(S.growth+2.5);document.getElementById('msg').textContent={water:'ارتوت الياسمينة، الله يسقيها.',light:'ضوّيت عليها، فردت أوراقها.',food:'غذّيتها، رح تقوى.'}[k]}save();draw()}function resetGame(){if(confirm('بدك تبدأ من الأول؟')){S=fresh();save();draw()}}tick();draw();save();setInterval(()=>{tick();save();draw()},30000);
</script></html>
