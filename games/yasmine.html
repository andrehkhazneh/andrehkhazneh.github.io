*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff9e9,#e8f3e9);color:#304337;font-family:Tahoma,Arial,sans-serif;line-height:1.7}main{max-width:530px;margin:auto;padding:16px 16px 55px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}a{color:#376c51}button{cursor:pointer;font:inherit}header a,header button{border:1px solid #c5d5be;background:#fff9ec;border-radius:12px;padding:8px 12px;color:#355540;text-decoration:none}h1{text-align:center;font-size:clamp(28px,7vw,38px);margin:20px 0 2px}h2{font-size:22px}.sub,.stage{text-align:center;margin:6px 0}.stage{font-weight:bold;color:#37714c}.scene{position:relative;border-radius:25px;overflow:hidden;border:2px solid #c2ddc4;box-shadow:0 14px 30px #3a674b20;background:#cceafa}.scene svg{width:100%;height:auto;display:block}#sun{transition:transform 1s,opacity 1s}#moon{transition:opacity 1s}#plant{transform-origin:150px 297px;animation:sway 6s ease-in-out infinite}@keyframes sway{50%{transform:rotate(1.2deg)}}.stats{display:grid;gap:10px;margin:20px 0}.meter{display:grid;grid-template-columns:68px 1fr 40px;align-items:center;gap:10px;font-size:14px}.bar{height:13px;background:#d1dfd5;border-radius:12px;overflow:hidden}.bar i{display:block;height:100%;transition:width .5s;border-radius:12px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.actions button,.primary{background:linear-gradient(#fffefa,#e7d1ac);border:2px solid #d1b38b;border-radius:15px;box-shadow:0 5px 0 #b49470,0 8px 16px #8b76533a;padding:13px 5px;font-size:15px;font-weight:bold;color:#3d342d;min-height:57px}.actions button:active,.primary:active{transform:translateY(4px);box-shadow:0 1px 0 #b49470}button:disabled{opacity:.55;cursor:not-allowed}.message{min-height:52px;color:#526e48;text-align:center;font-weight:bold}.note{background:#ffffffb8;border:1px solid #d0dfca;border-radius:15px;padding:13px 16px;margin:9px 0}.locked{color:#7e8d81;border-style:dashed}.progress{background:#ffffff9c;padding:12px 15px;border-radius:14px;margin:16px 0;text-align:center}.progress strong{color:#37714c}#reset{display:block;margin:24px auto;background:none;border:1px solid #b8cbb7;border-radius:12px;padding:9px 15px;color:#5a6e5c}.overlay{position:fixed;inset:0;background:#182e27a8;z-index:5;display:none;align-items:center;justify-content:center;padding:20px}.overlay.open{display:flex}.panel{width:min(370px,100%);background:#fff9ed;border-radius:22px;padding:24px;box-shadow:0 18px 60px #0004}.panel a,.panel button{display:block;width:100%;padding:12px;margin:8px 0;text-align:center;background:#e5efe3;border:1px solid #bdd0b9;border-radius:12px;text-decoration:none;color:#304337}.help{font-size:13px;color:#667b68;text-align:center}.sky-cloud{animation:float 18s ease-in-out infinite alternate}@keyframes float{to{transform:translateX(22px)}}@media(prefers-reduced-motion:reduce){#plant,.sky-cloud{animation:none}}</style></head>

id="water" style="background:#61aee2"></i></div><span id="waterVal"></span></div><div class="meter"><span data-i="light">الضوء</span><div class="bar"><i id="light" style="background:#e7bc4f"></i></div><span id="lightVal"></span></div><div class="meter"><span data-i="food">الغذاء</span><div class="bar"><i id="food" style="background:#9a81ca"></i></div><span id="foodVal"></span></div></div><div class="actions"><button id="waterBtn" data-i="waterBtn">💧 اسقيها</button><button id="lightBtn" data-i="lightBtn">☀️ ضوّي عليها</button><button id="foodBtn" data-i="foodBtn">🌱 غذّيها</button></div><p class="message" id="msg" aria-live="polite"></p><p class="help" data-i="help">العناية اليومية بتساعدها تنمو. ارجع بكرا لتتابع رحلتها.</p><h2 data-i="notes">خواطر الياسمينة</h2><div id="notesList"></div><button id="reset" data-i="reset">ابدأ من جديد</button></main><div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-label="Menu"><div class="panel"><h2 data-i="menu">القائمة</h2><a id="homeLink" href="/#games">العودة للألعاب</a><button id="langBtn">English</button><button id="howBtn" data-i="how">كيف ألعب؟</button><button id="closeBtn" data-i="close">إغلاق</button></div></div><script>
const dict={ar:{title:'🌿 ياسمينة البيت',subtitle:'كل زهرة إلها حكاية، وكل يوم إله عناية.',menu:'القائمة',growth:'نمو الياسمينة',day:'اليوم',water:'الماء',light:'الضوء',food:'الغذاء',waterBtn:'💧 اسقيها',lightBtn:'☀️ ضوّي عليها',foodBtn:'🌱 غذّيها',help:'العناية اليومية بتساعدها تنمو. ارجع بكرا لتتابع رحلتها.',notes:'خواطر الياسمينة',reset:'ابدأ من جديد',how:'كيف ألعب؟',close:'إغلاق',home:'← العودة للألعاب',stages:['بذرة صغيرة','نبتة طلّعت راسها','أوراق خضراء','نبتة قوية','براعم الياسمين','ياسمينة مزهّرة'],locked:'بتنفتح خاطرة جديدة لما تكبر الياسمينة.',wait:'اهتمّيت فيها اليوم. ارجع بكرا حتى تكمل نموّها.',done:'عملت هالخطوة اليوم. جرّب عناية تانية أو ارجع بكرا.',ok:'الياسمينة فرحت بعنايتك!',howText:'كل يوم فيك تسقي الياسمينة، تعرّضها للشمس وتغذّيها مرة واحدة لكل نوع. نموها بياخد عدة أيام، وبتنفتح الخواطر بالتدريج.',resetConfirm:'متأكد بدك تبدأ من جديد؟',notesTexts:['هون بتحط خاطرتك الأولى.','هون بتحط خاطرتك التانية.','هون بتحط خاطرتك التالتة.','هون بتحط خاطرتك الرابعة.','هون بتحط خاطرتك الأخيرة، لما تزهّر.']},en:{title:'🌿 Jasmine of Home',subtitle:'Every flower has a story. Every day brings care.',menu:'Menu',growth:'Jasmine growth',day:'Day',water:'Water',light:'Sunlight',food:'Nutrients',waterBtn:'💧 Water',lightBtn:'☀️ Sunlight',foodBtn:'🌱 Feed',help:'Daily care helps your jasmine grow. Return tomorrow to continue its journey.',notes:'Jasmine Reflections',reset:'Start over',how:'How to play',close:'Close',home:'← Back to games',stages:['A tiny seed','A little sprout','Fresh green leaves','Growing stronger','Jasmine buds','Jasmine in bloom'],locked:'A new reflection unlocks as your jasmine grows.',wait:'You cared for your jasmine today. Come back tomorrow to help it grow.',done:'You already did this today. Try another action or return tomorrow.',ok:'Your jasmine loved the care!',howText:'Water, give sunlight and feed your jasmine once per action each day. It takes several days to bloom, and reflections unlock along the way.',resetConfirm:'Are you sure you want to start over?',notesTexts:['Your first reflection goes here.','Your second reflection goes here.','Your third reflection goes here.','Your fourth reflection goes here.','Your final reflection, when the jasmine blooms.']}};
const thresholds=[10,30,55,80,100],key='yasmine-game-v2',fresh=()=>({water:65,light:65,food:65,growth:0,day:1,lastDay:new Date().toLocaleDateString('en-CA'),actions:{},t:Date.now()});let S;try{S=JSON.parse(localStorage.getItem(key))||fresh()}catch(e){S=fresh()}let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'ar';const $=id=>document.getElementById(id),clamp=n=>Math.max(0,Math.min(100,n));function save(){try{localStorage.setItem(key,JSON.stringify(S))}catch(e){}}function updateDay(){let today=new Date().toLocaleDateString('en-CA');if(S.lastDay!==today){let elapsed=Math.max(1,Math.floor((Date.now()-(S.t||Date.now()))/86400000));S.day=(S.day||1)+elapsed;S.water=clamp(S.water-12*elapsed);S.light=clamp(S.light-9*elapsed);S.food=clamp(S.food-7*elapsed);S.actions={};S.lastDay=today;S.t=Date.now();save()}}function render(){updateDay();let d=dict[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title=d.title+' | Andreh Khazneh';document.querySelectorAll('[data-i]').forEach(el=>el.textContent=d[el.dataset.i]);$('back').textContent=d.home;$('homeLink').textContent=d.home;$('homeLink').href=lang==='en'?'/english.html#games':'/#games';$('back').href=$('homeLink').href;$('langBtn').textContent=lang==='ar'?'English':'العربية';$('growth').textContent=Math.floor(S.growth)+'%';$('day').textContent=S.day;for(let k of ['water','light','food']){$(k).style.width=S[k]+'%';$(k+'Val').textContent=Math.round(S[k])+'%';$(k+'Btn').disabled=!!S.actions?.[k]}let g=S.growth,idx=g>=90?5:g>=65?4:g>=50?3:g>=25?2:g>=6?1:0;$('stage').textContent=d.stages[idx];$('notesList').innerHTML=thresholds.map((t,i)=>'<div class="note '+(g<t?'locked':'')+'">'+(g>=t?d.notesTexts[i]:'🔒 '+d.locked)+'</div>').join('');drawPlant();save()}
function drawPlant(){let g=S.growth,out='';if(g<6)out='<ellipse cx="150" cy="282" rx="5" ry="3" fill="#725137"/>'+(g>2?'<path d="M150 283Q150 275 152 268" stroke="#4a8a63" stroke-width="3" fill="none"/>':'');else{let h=25+g*1.75,top=281-h;out='<path d="M150 283Q134 '+(281-h*.5)+' 150 '+top+'" stroke="#4b8758" stroke-width="4" fill="none"/>';for(let i=0;i<Math.min(14,Math.floor(g/6));i++){let t=.16+i/15*.79,y=281-h*t,x=150-24*t*(1-t),side=i%2?-1:1;out+='<path d="M0 0C12 -11 30 -10 40 0C30 10 12 11 0 0Z" fill="'+(i%3?'#67b778':'#3f925a')+'" transform="translate('+x+' '+y+') scale('+side*.78+' .78) rotate(-25)"/>'}if(g>=65)for(let i=0;i<5;i++){let x=150+(i-2)*19,y=top+Math.abs(i-2)*14;if(g>=90){out+='<g transform="translate('+x+' '+y+')">';for(let p=0;p<5;p++)out+='<ellipse cx="0" cy="-7" rx="4" ry="8" fill="#fffdf4" transform="rotate('+(p*72)+')"/>';out+='<circle r="3" fill="#efc75c"/></g>'}else out+='<ellipse cx="'+x+'" cy="'+y+'" rx="4" ry="7" fill="#f6f2d8"/>'}}$('plant').innerHTML=out}
function care(k){updateDay();if(S.actions?.[k]){$('msg').textContent=dict[lang].done;return}S.actions=S.actions||{};S.actions[k]=true;S[k]=clamp(S[k]+23);S.growth=clamp(S.growth+4);$('msg').textContent=dict[lang].ok;render()}function openMenu(open){$('overlay').classList.toggle('open',open);$('menuBtn').setAttribute('aria-expanded',String(open))}for(let k of ['water','light','food'])$(k+'Btn').addEventListener('click',()=>care(k));$('menuBtn').addEventListener('click',()=>openMenu(true));$('closeBtn').addEventListener('click',()=>openMenu(false));$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))openMenu(false)});document.addEventListener('keydown',e=>{if(e.key==='Escape')openMenu(false)});$('langBtn').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';history.replaceState(null,'',location.pathname+(lang==='en'?'?lang=en':''));openMenu(false);render()});$('howBtn').addEventListener('click',()=>alert(dict[lang].howText));$('reset').addEventListener('click',()=>{if(confirm(dict[lang].resetConfirm)){S=fresh();$('msg').textContent='';render()}});render();
</script></body></html>
