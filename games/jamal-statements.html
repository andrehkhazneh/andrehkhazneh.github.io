<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دفتر جمال · حديقة السعادة</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e4d7;color:#332f27;font:17px/1.55 Tahoma,Arial,sans-serif}main{max-width:510px;margin:auto;padding:16px 14px 28px;--ink:#31533c;--wash:#e4eadb}main.cat{--ink:#754b5b;--wash:#f3e4e7}main.staff{--ink:#40566a;--wash:#e2e9ed}header,footer,.total{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:24px;margin:3px 0 12px}small{font-size:13px;color:#655a48}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:4px 0 16px}button{font:inherit;color:inherit;font-weight:bold;padding:10px 2px;border-radius:10px;border:1px solid #aaa895;background:#faf6e9;cursor:pointer}button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}article{position:relative;padding:23px 22px 18px;border:1px solid #b7a786;border-inline-start:5px solid var(--ink);background:radial-gradient(at top left,#e8dab9,transparent 38%),linear-gradient(120deg,#fffaed,#fbf2dd);box-shadow:0 5px 15px #463b2320}article:before{content:'';position:absolute;inset:6px;pointer-events:none;border:1px solid #c3b48e88}.flower{position:absolute;left:21px;top:8px;color:var(--ink);font:42px Georgia,serif;opacity:.65}.brand{color:var(--ink);font-weight:bold;font-size:14px}h2{margin:16px 0 0;font-size:clamp(22px,6vw,30px)}.period{color:#61553f;margin:0 0 18px;font-size:14px}table{width:100%;border-collapse:collapse}th{text-align:start;background:var(--ink);color:white;font-size:14px;padding:8px}td{padding:11px 8px;border-bottom:1px solid #d7c8ab}th:last-child,td:last-child{text-align:end;font-weight:bold;white-space:nowrap}td small{display:block}.total{background:var(--wash);color:var(--ink);border-inline-start:3px solid var(--ink);padding:10px;margin:16px 0;font-weight:bold}.total b{white-space:nowrap;font-size:22px}details{font-size:14px}summary{cursor:pointer;text-decoration:underline;text-underline-offset:3px}footer{margin-top:18px;border-top:1px solid #cdbf9f;padding-top:9px}.sig{font:italic bold 23px Georgia,serif;color:var(--ink)}
</style><main id="app"><header><h1>دفتر جمال</h1><small>معاينة بأرقام تجريبية</small></header><nav aria-label="اختر الكشف"><button data-k="garden">المشتل</button><button data-k="cat">ميمي</button><button data-k="staff">الموظفين</button></nav><article aria-live="polite"><span class="flower" aria-hidden="true">❧</span><div class="brand">حديقة السعادة</div><h2 id="heading"></h2><p class="period">من أول اللعبة لليوم</p><table><thead><tr><th>البيان</th><th>المبلغ بالعملة</th></tr></thead><tbody id="rows"></tbody></table><div class="total"><span id="label"></span><b id="value"></b></div><details id="help"><summary>كيف انحسب المبلغ؟</summary><p id="formula"></p></details><footer><small>محاسب المشتل</small><span class="sig">جمال</span></footer></article></main><script>
const sheets={
garden:['حسابات المشتل',[['ثمن البذور اللي اشتريتها',3460],['قبضت من بيع النباتات',8666]],'الصافي بعد ثمن البذور','منطرح ثمن كل البذور المشتراة من المقبوضات عن بيع النباتات. البذور اللي لسا ما انباعت نبتتها داخلة بالحسبة. السماد والرواتب إلها حساب منفصل.'],
cat:['مصاريف ميمي',[['طعام ميمي',543],['حبّات المكافأة',444],['ملابس وأغراض من المتجر',655]],'مجموع مصاريف ميمي','منجمع الطعام والمكافآت وأغراض المتجر. كل عملية شراء بتنحسب مرة وحدة.'],
staff:['رواتب الموظفين ومكافآتهم',[['أبو وردة',554,'البستاني · رواتب'],['نانا',444,'مربية القطط · رواتب'],['ياسمين',90,'مديرة المشتل · بونص'],['جمال',60,'المحاسب · رواتب']],'مجموع المدفوع للموظفين','منجمع الرواتب المدفوعة وبونص ياسمين المدفوع. الراتب المستحق بينضاف وقت الدفع.']};
function draw(key){const [title,lines,total,note]=sheets[key];const n=v=>v.toLocaleString('ar-EG');app.className=key;heading.textContent=title;rows.replaceChildren();for(const [name,money,role] of lines){let tr=rows.insertRow(),td=tr.insertCell();td.textContent=name;if(role){let sm=document.createElement('small');sm.textContent=role;td.append(sm)}tr.insertCell().textContent=n(money)}label.textContent=total;value.textContent=n(key==='garden'?lines[1][1]-lines[0][1]:lines.reduce((a,r)=>a+r[1],0))+' عملة';formula.textContent=note;help.open=false;document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===key)))}
document.querySelector('nav').onclick=e=>{if(e.target.dataset.k)draw(e.target.dataset.k)};draw('garden');
</script></html>
